<p>架前端網站總是要重複處理 HTML、CSS 和部署，所以我做了這個工具：
只要寫設定檔和 Markdown，一個指令就能產生網站並部署到 GitHub Pages。</p>
<ul>
<li>原始碼：<a href="https://github.com/Yorukidzuki/quicksite">GitHub</a></li>
<li>技術：Python、Jinja2、MCP</li>
<li>特色：手機版排版、深色模式、49 個單元測試、GitHub Actions 自動測試</li>
</ul>
